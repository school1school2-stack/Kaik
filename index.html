<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة طلبات الكيك الفاخر</title>
    <!-- خطوط جوجل وفونت أوسم للأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060409 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gold: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 100%);
            --text-gold: #d4af37;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(255, 255, 255, 0.05);
            --btn-gold: linear-gradient(135deg, #bf953f 0%, #d4af37 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .invoice-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .invoice-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-gold);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--accent-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-title {
            font-size: 16px;
            color: var(--text-gold);
            margin: 20px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .input-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: var(--text-gold);
            opacity: 0.8;
            font-size: 16px;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group select {
            appearance: none;
            cursor: pointer;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            border-color: #bf953f;
            box-shadow: 0 0 10px rgba(191, 149, 63, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .textarea-large {
            min-height: 150px;
            resize: vertical;
        }

        /* حقول التوصيل الديناميكية */
        #delivery-fields {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* زر عرض تفاصيل الطلب الفخم */
        .btn-view-details {
            background: rgba(191, 149, 63, 0.1);
            border: 1px solid #bf953f;
            color: var(--text-gold);
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .btn-view-details:hover {
            background: var(--btn-gold);
            color: #000;
            box-shadow: 0 5px 15px rgba(191, 149, 63, 0.2);
        }

        /* نافذة التفاصيل المنبثقة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 3, 13, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0; pointer-events: none;
            transition: all 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }

        .modal-card {
            background: #130f24;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transform: scale(0.8);
            transition: all 0.4s ease;
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            font-size: 18px;
            color: var(--text-gold);
            font-weight: 700;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-body {
            font-size: 15px;
            color: #e5e7eb;
            line-height: 1.8;
            white-space: pre-line; /* يحافظ على توزيع الأسطر كما كتبت تماماً */
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .modal-close-btn {
            background: var(--btn-gold);
            border: none; color: #000;
            padding: 10px 20px; border-radius: 8px;
            font-weight: 700; cursor: pointer;
            width: 100%; margin-top: 20px;
            transition: all 0.3s ease;
        }

        /* تفاصيل حساب الفاتورة الفخم */
        .invoice-bill-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: var(--text-light);
        }

        .bill-row.total-row {
            border-bottom: none;
            padding-top: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .bill-row.total-row .price-val {
            color: var(--text-gold);
            font-size: 24px;
        }

        .price-val span {
            font-size: 13px;
            margin-right: 3px;
            font-weight: normal;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            background: var(--btn-gold);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(191, 149, 63, 0.3);
            filter: brightness(1.1);
        }

        /* وضع العرض للعميل */
        body.view-only input, body.view-only textarea, body.view-only select {
            pointer-events: none;
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
            color: #d1d5db;
        }
        body.view-only .admin-only {
            display: none;
        }
    </style>
</head>
<body>

    <div class="invoice-container" id="invoiceBlock">
        <header>
            <h1><i class="fa-solid fa-cake-candles"></i> متجر الكيك الفاخر</h1>
            <p id="pageSubtitle">طلب جديد / فاتورة العميل الرقمية</p>
        </header>

        <!-- بيانات العميل والوقت -->
        <div class="section-title">
            <i class="fa-solid fa-user-tag"></i> بيانات العميل والوقت
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>اسم العميل</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="custName" placeholder="أدخل اسم العميل ثلاثي">
                </div>
            </div>
            <div class="input-group">
                <label>رقم الجوال</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="custPhone" placeholder="05xxxxxxxx" style="text-align: left; direction: ltr; padding-right: 15px; padding-left: 45px;">
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>وقت الطلب</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar-plus"></i>
                    <input type="datetime-local" id="orderTime">
                </div>
            </div>
            <div class="input-group">
                <label>وقت التسليم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar-check"></i>
                    <input type="datetime-local" id="deliveryTime">
                </div>
            </div>
        </div>

        <!-- آلية التسليم -->
        <div class="section-title">
            <i class="fa-solid fa-truck"></i> آلية التسليم
        </div>
        <div class="input-group">
            <label>نوع التسليم</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-boxes-packing"></i>
                <select id="deliveryType" onchange="toggleDeliveryFields()">
                    <option value="pickup">🏠 استلام من المتجر</option>
                    <option value="delivery">🚗 توصيل مع مندوب</option>
                </select>
            </div>
        </div>

        <!-- حقول التوصيل والمندوب -->
        <div id="delivery-fields">
            <div class="grid-2">
                <div class="input-group">
                    <label>سعر التوصيل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <input type="number" id="deliveryPrice" value="0" min="0" oninput="calculateTotal()" placeholder="0.00">
                    </div>
                </div>
                <div class="input-group">
                    <label>رقم المندوب</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="driverNum" placeholder="اسم أو رقم المندوب">
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>توقيت خروج المندوب</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-clock"></i>
                    <input type="time" id="driverTime">
                </div>
            </div>
        </div>

        <!-- تفاصيل ومواصفات الكيك -->
        <div class="section-title">
            <i class="fa-solid fa-cake-candles"></i> مواصفات وتفاصيل طلب الكيك
        </div>
        
        <div class="grid-2">
            <div class="input-group" style="grid-column: span 2;">
                <label>سعر الكيكة الأساسي</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-money-bill-check"></i>
                    <input type="number" id="cakePrice" value="0" min="0" oninput="calculateTotal()" placeholder="0.00">
                </div>
            </div>
        </div>
        
        <!-- حقل الإدخال لك (يختفي عند العميل ويحل محله الزر الفخم) -->
        <div class="input-group admin-only" id="inputDetailsGroup">
            <label>تفاصيل الطلب المعتمده (الصق الرسالة الطويلة هنا)</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-paragraph" style="top: 15px;"></i>
                <textarea id="cakeDetails" class="textarea-large" placeholder="اكتب تفاصيل الكيكة المعتمدة هنا..."></textarea>
            </div>
        </div>

        <!-- زر العرض السلس (يظهر للجميع وخاصة للعميل لكي لا تنزعج عينه) -->
        <div class="input-group">
            <label id="btnLabel">مواصفات الكيك الفنية</label>
            <button class="btn-view-details" onclick="openDetailsModal()">
                <i class="fa-solid fa-file-lines"></i> 🔍 اضغط هنا لعرض تفاصيل ومواصفات الطلب كاملة
            </button>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>الإضافات (الشموع، قاعدة خشبية، بالونات...الخ)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-ice-cream"></i>
                    <input type="text" id="extraDetails" placeholder="مثال: طقم شموع + تغليف خاص">
                </div>
            </div>
            <div class="input-group">
                <label>سعر الإضافات</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-coins"></i>
                    <input type="number" id="extraPrice" value="0" min="0" oninput="calculateTotal()" placeholder="0.00">
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>الملاحظات الخاصة</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-comment-dots"></i>
                <input type="text" id="notes" placeholder="أي ملاحظات إضافية أو تنويهات حساسية">
            </div>
        </div>

        <!-- تفاصيل الفاتورة بالتفصيل التام -->
        <div class="invoice-bill-box">
            <div class="bill-row">
                <span>سعر الطلب (الكيك الأساسي):</span>
                <span class="price-val" id="billCakePrice">0.00 <span>ريال</span></span>
            </div>
            <div class="bill-row">
                <span>سعر الإضافات:</span>
                <span class="price-val" id="billExtraPrice">0.00 <span>ريال</span></span>
            </div>
            <div class="bill-row">
                <span>سعر التوصيل:</span>
                <span class="price-val" id="billDeliveryPrice">0.00 <span>ريال</span></span>
            </div>
            <div class="bill-row total-row">
                <span>المجموع الكلي المعتمد:</span>
                <span class="price-val" id="billTotalAmount">0.00 <span>ريال</span></span>
            </div>
        </div>

        <!-- زر التحكم لتوليد الرابط (خاص بك ويختفي عند العميل) -->
        <div class="admin-only">
            <button class="btn-submit" onclick="generateShareableLink()">
                <i class="fa-solid fa-share-nodes"></i> توليد رابط الفاتورة الرقمية للعميل
            </button>
        </div>
    </div>

    <!-- النافذة المنبثقة الذكية لعرض التفاصيل الطويلة بدقة ونظافة -->
    <div class="modal-overlay" id="detailsModal" onclick="closeDetailsModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <i class="fa-solid fa-cake-candles"></i> تفاصيل ومواصفات الكيك المعتمده
            </div>
            <div class="modal-body" id="modalTextContent">
                <!-- هنا ستظهر الرسالة الطويلة منسقة بأسطرها -->
            </div>
            <button class="modal-close-btn" onclick="closeDetailsModal(null)">إغلاق وتصفح الفاتورة</button>
        </div>
    </div>

    <script>
        function toggleDeliveryFields() {
            const type = document.getElementById('deliveryType').value;
            const deliveryFields = document.getElementById('delivery-fields');
            const deliveryPriceInput = document.getElementById('deliveryPrice');

            if (type === 'delivery') {
                deliveryFields.style.display = 'block';
            } else {
                deliveryFields.style.display = 'none';
                deliveryPriceInput.value = 0;
                calculateTotal();
            }
        }

        function calculateTotal() {
            const cakePrice = parseFloat(document.getElementById('cakePrice').value) || 0;
            const extraPrice = parseFloat(document.getElementById('extraPrice').value) || 0;
            const deliveryPrice = parseFloat(document.getElementById('deliveryPrice').value) || 0;
            
            const total = cakePrice + extraPrice + deliveryPrice;

            document.getElementById('billCakePrice').innerHTML = cakePrice.toFixed(2) + ' <span>ريال</span>';
            document.getElementById('billExtraPrice').innerHTML = extraPrice.toFixed(2) + ' <span>ريال</span>';
            document.getElementById('billDeliveryPrice').innerHTML = deliveryPrice.toFixed(2) + ' <span>ريال</span>';
            document.getElementById('billTotalAmount').innerHTML = total.toFixed(2) + ' <span>ريال</span>';
        }

        // دوال النافذة المنبثقة الذكية
        function openDetailsModal() {
            const textValue = document.getElementById('cakeDetails').value || "لا توجد تفاصيل إضافية مدرجة.";
            document.getElementById('modalTextContent').textContent = textValue;
            document.getElementById('detailsModal').classList.add('active');
        }

        function closeDetailsModal(e) {
            document.getElementById('detailsModal').classList.remove('active');
        }

        // توليد الرابط المشفر للعميل
        function generateShareableLink() {
            const data = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                oTime: document.getElementById('orderTime').value,
                dTime: document.getElementById('deliveryTime').value,
                delType: document.getElementById('deliveryType').value,
                delPrice: document.getElementById('deliveryPrice').value,
                driver: document.getElementById('driverNum').value,
                driverT: document.getElementById('driverTime').value,
                cakeP: document.getElementById('cakePrice').value,
                details: document.getElementById('cakeDetails').value,
                extDet: document.getElementById('extraDetails').value,
                extPrice: document.getElementById('extraPrice').value,
                notes: document.getElementById('notes').value
            };

            const jsonString = JSON.stringify(data);
            const encodedData = btoa(unescape(encodeURIComponent(jsonString)));
            const shareableUrl = window.location.origin + window.location.pathname + "?invoice=" + encodedData;

            navigator.clipboard.writeText(shareableUrl).then(() => {
                alert("تم توليد الرابط الذكي ونسخه تلقائياً! أرسله الآن للعميل.");
            }).catch(() => {
                prompt("انسخ الرابط من هنا:", shareableUrl);
            });
        }

        // معالجة الرابط عند الفتح للعميل
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('invoice')) {
                try {
                    const encodedData = urlParams.get('invoice');
                    const decodedString = decodeURIComponent(escape(atob(encodedData)));
                    const data = JSON.parse(decodedString);

                    document.getElementById('custName').value = data.name;
                    document.getElementById('custPhone').value = data.phone;
                    document.getElementById('orderTime').value = data.oTime;
                    document.getElementById('deliveryTime').value = data.dTime;
                    document.getElementById('deliveryType').value = data.delType;
                    document.getElementById('deliveryPrice').value = data.delPrice;
                    document.getElementById('driverNum').value = data.driver;
                    document.getElementById('driverTime').value = data.driverT;
                    document.getElementById('cakePrice').value = data.cakeP;
                    document.getElementById('cakeDetails').value = data.details;
                    document.getElementById('extraDetails').value = data.extDet;
                    document.getElementById('extraPrice').value = data.extPrice;
                    document.getElementById('notes').value = data.notes;

                    if(data.delType === 'delivery') {
                        document.getElementById('delivery-fields').style.display = 'block';
                    }

                    calculateTotal();

                    // تحويل لوضع العرض فقط وحذف الحقول الإدارية والزر لراحة عين العميل
                    document.body.classList.add('view-only');
                    document.getElementById('pageSubtitle').innerText = "الفاتورة الرقمية الرسمية للطلب";
                    document.getElementById('btnLabel').innerText = "تفاصيل الطلب المعتمدة";

                    document.querySelectorAll('input, textarea, select').forEach(el => {
                        el.readOnly = true;
                        el.disabled = true;
                    });

                } catch (e) {
                    console.error("خطأ في قراءة بيانات الرابط المشفر", e);
                }
            }
        }
    </script>
</body>
</html>
