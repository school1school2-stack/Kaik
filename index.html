<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب الكيك الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060409 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-gold: #d4af37;
            --text-light: #f3f4f6;
            --input-bg: rgba(255, 255, 255, 0.05);
        }
        body { background: var(--bg-gradient); color: var(--text-light); font-family: 'Cairo', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .invoice-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; width: 100%; max-width: 750px; padding: 35px; }
        .input-group { margin-bottom: 15px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; right: 15px; color: var(--text-gold); }
        input, textarea, select { width: 100%; padding: 12px 45px; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; outline: none; }
        .total-box { text-align: center; padding: 20px; border: 1px dashed var(--text-gold); border-radius: 14px; margin-top: 20px; }
        .btn-share { width: 100%; padding: 15px; background: #d4af37; border: none; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; margin-top: 20px; }
        [readonly] { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="invoice-container" id="formContainer">
    <h2 style="text-align:center; color: var(--text-gold);">تفاصيل الطلب</h2>
    
    <div id="fieldsContainer">
        <!-- الحقول -->
        <div class="input-group"><input type="text" id="custName" placeholder="اسم العميل"></div>
        <div class="input-group"><input type="text" id="custPhone" placeholder="رقم الجوال"></div>
        <div class="input-group"><input type="number" id="cakePrice" placeholder="سعر الكيكة" oninput="calc()"></div>
        <div class="input-group"><textarea id="details" placeholder="تفاصيل الطلب" rows="4"></textarea></div>
        <div class="input-group"><input type="number" id="extraPrice" placeholder="سعر الإضافات" oninput="calc()"></div>
        <div class="input-group"><input type="number" id="deliveryPrice" placeholder="سعر التوصيل" oninput="calc()"></div>
    </div>

    <div class="total-box">
        الإجمالي: <span id="totalDisplay">0</span> ريال
    </div>

    <button class="btn-share" onclick="generateShareableLink()">توليد رابط عرض للعميل</button>
</div>

<script>
    function calc() {
        let total = (parseFloat(document.getElementById('cakePrice').value) || 0) +
                    (parseFloat(document.getElementById('extraPrice').value) || 0) +
                    (parseFloat(document.getElementById('deliveryPrice').value) || 0);
        document.getElementById('totalDisplay').innerText = total;
    }

    function generateShareableLink() {
        const data = {
            n: document.getElementById('custName').value,
            p: document.getElementById('custPhone').value,
            cp: document.getElementById('cakePrice').value,
            dt: document.getElementById('details').value,
            ep: document.getElementById('extraPrice').value,
            dp: document.getElementById('deliveryPrice').value,
            t: document.getElementById('totalDisplay').innerText
        };
        
        // تحويل البيانات إلى نص مشفر بسيط
        const encoded = btoa(JSON.stringify(data));
        const url = window.location.origin + window.location.pathname + "?data=" + encoded;
        prompt("انسخ هذا الرابط وأرسله للعميل:", url);
    }

    // عند فتح الرابط، تحويل الحقول لـ للقراءة فقط (Read-only)
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('data')) {
            const data = JSON.parse(atob(params.get('data')));
            document.getElementById('custName').value = data.n;
            document.getElementById('custPhone').value = data.p;
            document.getElementById('cakePrice').value = data.cp;
            document.getElementById('details').value = data.dt;
            document.getElementById('extraPrice').value = data.ep;
            document.getElementById('deliveryPrice').value = data.dp;
            document.getElementById('totalDisplay').innerText = data.t;
            
            // جعل كل شيء للقراءة فقط
            document.querySelectorAll('input, textarea').forEach(el => el.readOnly = true);
            document.querySelector('.btn-share').style.display = 'none';
        }
    }
</script>
</body>
</html>
