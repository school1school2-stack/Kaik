<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة ومزامنة طلبات الكيك الفاخر</title>
    <!-- خطوط جوجل وفونت أوسم للأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* هوية لونية نسائية فاخرة وناعمة (وردي بودري، كريمي، وذهبي روز) */
            --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #fef0f3 50%, #f7e7eb 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(234, 182, 192, 0.4);
            --accent-gold: linear-gradient(135deg, #e5a9b4 0%, #f7d6dc 40%, #dca1ac 100%);
            --text-gold: #c57b88;
            --text-dark: #4a3538;
            --text-muted: #8c7377;
            --input-bg: rgba(255, 255, 255, 0.9);
            --btn-gold: linear-gradient(135deg, #e5a9b4 0%, #d48b98 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .invoice-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(229, 169, 180, 0.2);
            position: relative;
            overflow: hidden;
        }

        .invoice-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--accent-gold);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #b36471 0%, #d48b98 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        /* شريط البحث السحابي */
        .search-section {
            background: rgba(247, 231, 235, 0.4);
            border: 1px solid rgba(229, 169, 180, 0.3);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            background: #fff;
            border: 1px solid rgba(229, 169, 180, 0.4);
            border-radius: 10px;
            color: var(--text-dark);
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #d48b98;
            box-shadow: 0 0 8px rgba(212, 139, 152, 0.2);
        }

        .search-btn {
            background: var(--btn-gold);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .search-btn:hover {
            filter: brightness(1.05);
        }

        .search-results {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            background: #fff;
            border-radius: 10px;
            border: 1px solid rgba(229, 169, 180, 0.3);
        }

        .result-item {
            padding: 10px 15px;
            border-bottom: 1px solid #fceef1;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            color: var(--text-dark);
        }

        .result-item:hover {
            background: #fff0f3;
            color: #b36471;
        }

        .section-title {
            font-size: 16px;
            color: #b36471;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #fceef1;
            padding-bottom: 8px;
            font-weight: 700;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .input-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: var(--text-gold);
            opacity: 0.9;
            font-size: 16px;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: var(--input-bg);
            border: 1px solid rgba(229, 169, 180, 0.4);
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group select {
            appearance: none;
            cursor: pointer;
        }

        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            border-color: #d48b98;
            box-shadow: 0 0 8px rgba(212, 139, 152, 0.2);
            background: #fff;
        }

        .textarea-large {
            min-height: 150px;
            resize: vertical;
        }

        #delivery-fields {
            display: none;
        }

        .btn-view-details {
            background: #fff;
            border: 1px solid #e5a9b4;
            color: #b36471;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(229, 169, 180, 0.1);
        }

        .btn-view-details:hover {
            background: var(--btn-gold);
            color: #fff;
            border-color: transparent;
        }

        /* نافذة المودال المنبثقة الفاتحة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(74, 53, 56, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0; pointer-events: none;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-card {
            background: #fff;
            border: 1px solid rgba(229, 169, 180, 0.5);
            border-radius: 20px;
            width: 100%; max-width: 550px;
            padding: 25px; box-shadow: 0 15px 40px rgba(74, 53, 56, 0.15);
            transform: scale(0.8); transition: all 0.3s ease;
        }
        
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-header { font-size: 18px; color: #b36471; font-weight: 700; border-bottom: 2px solid #fceef1; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-body { font-size: 15px; color: var(--text-dark); line-height: 1.8; white-space: pre-line; max-height: 350px; overflow-y: auto; font-weight: 600; }
        .modal-close-btn { background: var(--btn-gold); border: none; color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 20px; }

        /* تفاصيل الفاتورة */
        .invoice-bill-box {
            background: #fff;
            border: 1px solid rgba(229, 169, 180, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(229, 169, 180, 0.05);
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #fceef1;
            font-size: 14px;
            font-weight: 600;
        }

        .bill-row.total-row {
            border-bottom: none;
            padding-top: 15px;
            font-size: 18px;
            font-weight: 700;
            color: #b36471;
        }

        .bill-row.total-row .price-val {
            color: #b36471;
            font-size: 24px;
            font-weight: 700;
        }

        .price-val span { font-size: 13px; margin-right: 3px; font-weight: 600; }

        /* أزرار التحكم والخيارات */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .actions-grid { grid-template-columns: 1fr; }
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save-cloud { background: linear-gradient(135deg, #6b8eff 0%, #4869d6 100%); }
        .btn-share-link { background: var(--btn-gold); }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 169, 180, 0.3);
            filter: brightness(1.05);
        }

        #status-msg {
            text-align: center; margin-top: 15px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity 0.3s;
        }

        body.view-only input, body.view-only textarea, body.view-only select {
            pointer-events: none; background: #faf5f6; border-color: #f2e2e5; color: #7a6568;
        }
        body.view-only .admin-only { display: none; }
    </style>
</head>
<body>

    <div class="invoice-container">
        <header>
            <h1><i class="fa-solid fa-birthday-cake"></i> متجر الكيك الفاخر</h1>
            <p id="pageSubtitle">نظام إدارة ومزامنة الطلبات السحابية</p>
        </header>

        <!-- لوحة البحث السحابي -->
        <div class="search-section admin-only">
            <div class="section-title" style="margin-top: 0; border-bottom-color: rgba(229, 169, 180, 0.2);"><i class="fa-solid fa-cloud-magnifying-glass"></i> البحث السحابي واسترجاع الفواتير</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث باسم العميل أو رقم الجوال هنا...">
                <button class="search-btn" onclick="searchCloudOrders()"><i class="fa-solid fa-magnifying-glass"></i> بحث</button>
            </div>
            <div class="search-results" id="searchResultsBox"></div>
        </div>

        <!-- بيانات العميل والوقت -->
        <div class="section-title"><i class="fa-solid fa-user-tag"></i> بيانات العميل والوقت</div>
        <div class="grid-2">
            <div class="input-group">
                <label>اسم العميل</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="custName" placeholder="أدخل اسم العميل">
                </div>
            </div>
            <div class="input-group">
                <label>رقم الجوال</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="custPhone" placeholder="05xxxxxxxx" style="text-align: left; direction: ltr; padding-right: 15px; padding-left: 45px;">
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>وقت الطلب</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar-plus"></i>
                    <input type="datetime-local" id="orderTime">
                </div>
            </div>
            <div class="input-group">
                <label>وقت التسليم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar-check"></i>
                    <input type="datetime-local" id="deliveryTime">
                </div>
            </div>
        </div>

        <!-- آلية التسليم -->
        <div class="section-title"><i class="fa-solid fa-truck"></i> آلية التسليم</div>
        <div class="input-group">
            <label>نوع التسليم</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-boxes-packing"></i>
                <select id="deliveryType" onchange="toggleDeliveryFields()">
                    <option value="pickup">🏠 استلام من المتجر</option>
                    <option value="delivery">🚗 توصيل مع مندوب</option>
                </select>
            </div>
        </div>

        <!-- حقول التوصيل -->
        <div id="delivery-fields">
            <div class="grid-2">
                <div class="input-group">
                    <label>سعر التوصيل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <input type="number" id="deliveryPrice" value="0" min="0" oninput="calculateTotal()">
                    </div>
                </div>
                <div class="input-group">
                    <label>رقم/اسم المندوب</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="driverNum" placeholder="المندوب المعني">
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>توقيت خروج المندوب</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-clock"></i>
                    <input type="time" id="driverTime">
                </div>
            </div>
        </div>

        <!-- مواصفات الكيك -->
        <div class="section-title"><i class="fa-solid fa-cake-candles"></i> مواصفات وتفاصيل طلب الكيك</div>
        
        <div class="input-group">
            <label>سعر الكيكة الأساسي</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-money-bill-check"></i>
                <input type="number" id="cakePrice" value="0" min="0" oninput="calculateTotal()">
            </div>
        </div>
        
        <div class="input-group admin-only">
            <label>تفاصيل الطلب المعتمدة (الصق الرسالة الطويلة كاملة هنا)</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-paragraph" style="top: 15px;"></i>
                <textarea id="cakeDetails" class="textarea-large" placeholder="ألصق محادثة الطلب كاملة هنا بجميع أسطرها..."></textarea>
            </div>
        </div>

        <!-- زر العرض المريح للعميل ولصاحبة المتجر -->
        <div class="input-group">
            <label id="btnLabel">مواصفات الفاتورة الفنية</label>
            <button class="btn-view-details" onclick="openDetailsModal()">
                <i class="fa-solid fa-file-lines"></i> 🔍 اضغط هنا لعرض تفاصيل ومواصفات الطلب كاملة
            </button>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>الإضافات (شموع، بالونات، قواعد..)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-ice-cream"></i>
                    <input type="text" id="extraDetails" placeholder="نوع الإضافات">
                </div>
            </div>
            <div class="input-group">
                <label>سعر الإضافات</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-coins"></i>
                    <input type="number" id="extraPrice" value="0" min="0" oninput="calculateTotal()">
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>الملاحظات الخاصة</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-comment-dots"></i>
                <input type="text" id="notes" placeholder="ملاحظات الإنتاج أو التغليف">
            </div>
        </div>

        <!-- حسابات الفاتورة الرسمية الناعمة -->
        <div class="invoice-bill-box">
            <div class="bill-row">
                <span>سعر الطلب (الكيك الأساسي):</span>
                <span class="price-val" id="billCakePrice">0.00 <span>ريال</span></span>
            </div>
            <div class="bill-row">
                <span>سعر الإضافات:</span>
                <span class="price-val" id="billExtraPrice">0.00 <span>ريال</span></span>
            </div>
            <div class="bill-row">
                <span>سعر التوصيل:</span>
                <span class="price-val" id="billDeliveryPrice">0.00 <span>ريال</span></span>
            </div>
            <div class="bill-row total-row">
                <span>المجموع الكلي المعتمد:</span>
                <span class="price-val" id="billTotalAmount">0.00 <span>ريال</span></span>
            </div>
        </div>

        <!-- خيارات التحكم والمزامنة -->
        <div class="actions-grid admin-only">
            <button class="btn-action btn-save-cloud" onclick="saveOrderToCloud()">
                <i class="fa-solid fa-cloud-arrow-up"></i> حفظ ومزامنة السحابة ☁️
            </button>
            <button class="btn-action btn-share-link" onclick="generateShareableLink()">
                <i class="fa-solid fa-share-nodes"></i> توليد رابط العميل الذكي
            </button>
        </div>

        <div id="status-msg"></div>
    </div>

    <!-- نافذة المودال الفخمة لعرض النص الطويل -->
    <div class="modal-overlay" id="detailsModal" onclick="closeDetailsModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header"><i class="fa-solid fa-birthday-cake"></i> تفاصيل ومواصفات الطلب بالكامل</div>
            <div class="modal-body" id="modalTextContent"></div>
            <button class="modal-close-btn" onclick="closeDetailsModal()">إغلاق وتصفح الفاتورة</button>
        </div>
    </div>

    <!-- محرك السحابة Firebase بالتزامن المباشر -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRuCsDIXbIXmkgcqilfYF5r3GL1Au8Ib0",
            authDomain: "ratbe-61e39.firebaseapp.com",
            projectId: "ratbe-61e39",
            storageBucket: "ratbe-61e39.firebasestorage.app",
            messagingSenderId: "680218146427",
            appId: "1:680218146427:web:c53a0f343855ee8aba54de",
            measurementId: "G-V3M9BT9690"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveOrderToCloud = saveOrderToCloud;
        window.searchCloudOrders = searchCloudOrders;
        window.loadSelectedOrder = loadSelectedOrder;

        async function saveOrderToCloud() {
            const phone = document.getElementById('custPhone').value.trim();
            const name = document.getElementById('custName').value.trim();

            if (!phone || !name) {
                showStatus("⚠️ يرجى كتابة اسم العميل ورقم جواله لحفظ الطلب سحابياً بشكل صحيح!", "#ef4444");
                return;
            }

            const orderData = {
                name: name,
                phone: phone,
                oTime: document.getElementById('orderTime').value,
                dTime: document.getElementById('deliveryTime').value,
                delType: document.getElementById('deliveryType').value,
                delPrice: document.getElementById('deliveryPrice').value,
                driver: document.getElementById('driverNum').value,
                driverT: document.getElementById('driverTime').value,
                cakeP: document.getElementById('cakePrice').value,
                details: document.getElementById('cakeDetails').value,
                extDet: document.getElementById('extraDetails').value,
                extPrice: document.getElementById('extraPrice').value,
                notes: document.getElementById('notes').value,
                savedAt: new Date()
            };

            try {
                await setDoc(doc(db, "cake_orders", phone), orderData);
                showStatus("✅ تم حفظ ومزامنة طلب " + name + " سحابياً بنجاح! ☁️", "#10b981");
            } catch (error) {
                showStatus("❌ خطأ أثناء الحفظ بالسحابة: " + error.message, "#ef4444");
            }
        }

        async function searchCloudOrders() {
            const queryText = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsBox = document.getElementById('searchResultsBox');
            resultsBox.innerHTML = "";
            
            if(!queryText) {
                resultsBox.style.display = "none";
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "cake_orders"));
                let found = false;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const custName = data.name || "";
                    const custPhone = data.phone || "";

                    if(custName.toLowerCase().includes(queryText) || custPhone.includes(queryText)) {
                        found = true;
                        const item = document.createElement('div');
                        item.className = "result-item";
                        item.setAttribute("onclick", `loadSelectedOrder('${btoa(unescape(encodeURIComponent(JSON.stringify(data))))}')`);
                        item.innerHTML = `<span>👤 ${custName}</span> <span style="color:#b36471; font-weight:700;">📱 ${custPhone}</span>`;
                        resultsBox.appendChild(item);
                    }
                });

                if(found) {
                    resultsBox.style.display = "block";
                } else {
                    resultsBox.innerHTML = "<div style='padding:10px; font-size:12px; color:#c57b88;'>❌ لم يتم العثور على نتائج متطابقة بالسحابة.</div>";
                    resultsBox.style.display = "block";
                }

            } catch (error) {
                console.error("خطأ أثناء جلب نتائج البحث:", error);
            }
        }

        function loadSelectedOrder(encodedData) {
            const data = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
            
            document.getElementById('custName').value = data.name || "";
            document.getElementById('custPhone').value = data.phone || "";
            document.getElementById('orderTime').value = data.oTime || "";
            document.getElementById('deliveryTime').value = data.dTime || "";
            document.getElementById('deliveryType').value = data.delType || "pickup";
            document.getElementById('deliveryPrice').value = data.delPrice || 0;
            document.getElementById('driverNum').value = data.driver || "";
            document.getElementById('driverTime').value = data.driverT || "";
            document.getElementById('cakePrice').value = data.cakeP || 0;
            document.getElementById('cakeDetails').value = data.details || "";
            document.getElementById('extraDetails').value = data.extDet || "";
            document.getElementById('extraPrice').value = data.extPrice || 0;
            document.getElementById('notes').value = data.notes || "";

            toggleDeliveryFields();
            calculateTotal();
            
            document.getElementById('searchResultsBox').style.display = "none";
            showStatus("📥 تم استرداد وتعبئة بيانات العميل بنجاح!", "#4869d6");
        }

        function showStatus(text, color) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.style.color = color;
            msg.style.opacity = "1";
            setTimeout(() => msg.style.opacity = "0", 4000);
        }
    </script>

    <!-- العمليات التفاعلية الأساسية للفاتورة -->
    <script>
        function toggleDeliveryFields() {
            const type = document.getElementById('deliveryType').value;
            const deliveryFields = document.getElementById('delivery-fields');
            const deliveryPriceInput = document.getElementById('deliveryPrice');

            if (type === 'delivery') {
                deliveryFields.style.display = 'block';
            } else {
                deliveryFields.style.display = 'none';
                deliveryPriceInput.value = 0;
                calculateTotal();
            }
        }

        function calculateTotal() {
            const cakePrice = parseFloat(document.getElementById('cakePrice').value) || 0;
            const extraPrice = parseFloat(document.getElementById('extraPrice').value) || 0;
            const deliveryPrice = parseFloat(document.getElementById('deliveryPrice').value) || 0;
            
            const total = cakePrice + extraPrice + deliveryPrice;

            document.getElementById('billCakePrice').innerHTML = cakePrice.toFixed(2) + ' <span>ريال</span>';
            document.getElementById('billExtraPrice').innerHTML = extraPrice.toFixed(2) + ' <span>ريال</span>';
            document.getElementById('billDeliveryPrice').innerHTML = deliveryPrice.toFixed(2) + ' <span>ريال</span>';
            document.getElementById('billTotalAmount').innerHTML = total.toFixed(2) + ' <span>ريال</span>';
        }

        function openDetailsModal() {
            const textValue = document.getElementById('cakeDetails').value || "لا توجد تفاصيل إضافية مدرجة.";
            document.getElementById('modalTextContent').textContent = textValue;
            document.getElementById('detailsModal').classList.add('active');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function generateShareableLink() {
            const data = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                oTime: document.getElementById('orderTime').value,
                dTime: document.getElementById('deliveryTime').value,
                delType: document.getElementById('deliveryType').value,
                delPrice: document.getElementById('deliveryPrice').value,
                driver: document.getElementById('driverNum').value,
                driverT: document.getElementById('driverTime').value,
                cakeP: document.getElementById('cakePrice').value,
                details: document.getElementById('cakeDetails').value,
                extDet: document.getElementById('extraDetails').value,
                extPrice: document.getElementById('extraPrice').value,
                notes: document.getElementById('notes').value
            };

            const jsonString = JSON.stringify(data);
            const encodedData = btoa(unescape(encodeURIComponent(jsonString)));
            const shareableUrl = window.location.origin + window.location.pathname + "?invoice=" + encodedData;

            navigator.clipboard.writeText(shareableUrl).then(() => {
                alert("تم توليد الرابط الأنيق للفاتورة ونسخه بنجاح! أرسله للعميل الآن عبر الواتساب.");
            }).catch(() => {
                prompt("انسخ الرابط من هنا:", shareableUrl);
            });
        }

        // قراءة الروابط وحالة العرض للعميل
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('invoice')) {
                try {
                    const encodedData = urlParams.get('invoice');
                    const decodedString = decodeURIComponent(escape(atob(encodedData)));
                    const data = JSON.parse(decodedString);

                    document.getElementById('custName').value = data.name || "";
                    document.getElementById('custPhone').value = data.phone || "";
                    document.getElementById('orderTime').value = data.oTime || "";
                    document.getElementById('deliveryTime').value = data.dTime || "";
                    document.getElementById('deliveryType').value = data.delType || "pickup";
                    document.getElementById('deliveryPrice').value = data.delPrice || 0;
                    document.getElementById('driverNum').value = data.driver || "";
                    document.getElementById('driverTime').value = data.driverT || "";
                    document.getElementById('cakePrice').value = data.cakeP || 0;
                    document.getElementById('cakeDetails').value = data.details || "";
                    document.getElementById('extraDetails').value = data.extDet || "";
                    document.getElementById('extraPrice').value = data.extPrice || 0;
                    document.getElementById('notes').value = data.notes || "";

                    if(data.delType === 'delivery') {
                        document.getElementById('delivery-fields').style.display = 'block';
                    }

                    calculateTotal();

                    document.body.classList.add('view-only');
                    document.getElementById('pageSubtitle').innerText = "الفاتورة الرقمية الرسمية المعتمدة للطلب";
                    document.getElementById('btnLabel').innerText = "تفاصيل ومواصفات الكيك المتفق عليها";

                    document.querySelectorAll('input, textarea, select').forEach(el => {
                        el.readOnly = true;
                        el.disabled = true;
                    });

                } catch (e) {
                    console.error("خطأ فك ترميز الرابط:", e);
                }
            }
        });
    </script>
</body>
</html>
